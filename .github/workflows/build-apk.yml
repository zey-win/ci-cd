      - name: Install Unity Android legacy resource preprocessor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/Assets/Editor
          cat > game/Assets/Editor/ZeyWinAndroidLegacyResourcePreprocessor.cs <<'CS'
          using System.IO;
          using UnityEditor;
          using UnityEditor.Build;
          using UnityEditor.Build.Reporting;

          public sealed class ZeyWinAndroidLegacyResourcePreprocessor : IPreprocessBuildWithReport
          {
              public int callbackOrder => 200000;

              public void OnPreprocessBuild(BuildReport report)
              {
                  if (report.summary.platform != BuildTarget.Android)
                      return;

                  var legacy = "Assets/Plugins/Android/res";
                  if (!Directory.Exists(legacy))
                  {
                      UnityEngine.Debug.Log("[ZeyWinActions] No obsolete Android resources in Assets/Plugins/Android/res during Unity prebuild.");
                      return;
                  }

                  var androidLib = "Assets/Plugins/Android/ZeyWinLegacyRes.androidlib";
                  var target = Path.Combine(androidLib, "src/main/res");
                  if (Directory.Exists(target))
                      Directory.Delete(target, true);

                  Directory.CreateDirectory(Path.GetDirectoryName(target));
                  Directory.Move(legacy, target);
                  File.WriteAllText(Path.Combine(androidLib, "AndroidManifest.xml"), "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"com.zeywin.legacyres\" />");
                  File.WriteAllText(Path.Combine(androidLib, "build.gradle"), "plugins {\n    id 'com.android.library'\n}\n\nandroid {\n    compileSdk 34\n    namespace 'com.zeywin.legacyres'\n}\n");

                  FileUtil.DeleteFileOrDirectory(legacy);
                  FileUtil.DeleteFileOrDirectory(legacy + ".meta");
                  if (Directory.Exists(legacy))
                      Directory.Delete(legacy, true);
                  if (File.Exists(legacy + ".meta"))
                      File.Delete(legacy + ".meta");

                  AssetDatabase.Refresh(ImportAssetOptions.ForceUpdate);
                  if (Directory.Exists(legacy))
                      throw new System.Exception("[ZeyWinActions] Obsolete Android resources folder still exists after cleanup: " + legacy);

                  UnityEngine.Debug.Log("[ZeyWinActions] Moved obsolete Android resources into Android Library and removed legacy folder during Unity prebuild: " + androidLib);
              }
          }
          CS

      - name: Universal SDK compatibility patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SCRIPT=".ci-patches/fix-sdk-integration.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "⚠️  $SCRIPT not found on disk – recovering..."
            mkdir -p .ci-patches
            git show HEAD:.ci-patches/fix-sdk-integration.py > "$SCRIPT" 2>/dev/null && echo "✅ Recovered from git" || {
              echo "Trying GitHub API as fallback..."
              curl -fsSL -H "Authorization: token ${{ github.token }}" \
                "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.ci-patches/fix-sdk-integration.py" \
                > "$SCRIPT" && echo "✅ Recovered via GitHub API" || {
                echo "❌ Cannot recover script – using built-in inline fallback"
                cat > "$SCRIPT" << 'EOF'
          #!/usr/bin/env python3
          import sys, pathlib, shutil, json, re, textwrap
          def main():
              if len(sys.argv) < 3: print("Usage: ... <Assets> <manifest>"); sys.exit(1)
              assets = pathlib.Path(sys.argv[1]); manifest_path = pathlib.Path(sys.argv[2])
              if not assets.exists(): print(f"❌ Assets not found: {assets}"); sys.exit(1)
              if not manifest_path.exists(): print(f"❌ manifest.json not found: {manifest_path}"); sys.exit(1)
              remove_gma_editor_stubs(assets); add_upm_packages(manifest_path); remove_conflicting_asset_sdks(assets, manifest_path)
              remove_obsolete_packages(manifest_path); fix_urp_pixelperfect(assets, manifest_path)
              remove_sdk_examples(assets); fix_dll_metas(assets); fix_dotween_modules(assets)
              fix_tmp_fonts(assets); clear_cached_files(assets)
          def remove_gma_editor_stubs(a):
              d = a / "GoogleMobileAds" / "Editor"
              if d.exists(): shutil.rmtree(d); print("  ✅ Removed GoogleMobileAds/Editor"); (pathlib.Path(str(d)+".meta")).unlink(missing_ok=True)
           def add_upm_packages(mp):
               m = json.loads(mp.read_text(encoding="utf-8"))
               regs = m.setdefault("scopedRegistries",[])
               if not any(r.get("url")=="https://package.openupm.com" for r in regs):
                   regs.append({"name":"OpenUPM","url":"https://package.openupm.com","scopes":["com.google.ads.mobile","com.google.external-dependency-manager"]})
                   print("  ✅ Added OpenUPM scoped registry")
               deps = m.setdefault("dependencies",{})
               for p,v in {"com.google.ads.mobile":"11.2.0","com.google.external-dependency-manager":"1.2.187","com.unity.textmeshpro":"3.0.9"}.items():
                   if p not in deps: deps[p]=v; print(f"  ✅ Added UPM {p}@{v}")
               mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
           def remove_obsolete_packages(mp):
               content = mp.read_text(encoding="utf-8")
               obsolete = ["com.unity.2d.pixel-perfect","com.unity.2d.aseprite","com.unity.2d.tilemap.extras","com.unity.modules.adaptiveperformance","com.unity.modules.vectorgraphics"]
               modified = False
               for pkg in obsolete:
                   if f'"{pkg}"' in content:
                       content = re.sub(rf'^\s*"{pkg}"\s*:\s*"[^"]+",?\s*$\n?', '', content, flags=re.MULTILINE)
                       print(f"  ✅ Removed obsolete package {pkg}")
                       modified = True
               if modified:
                   mp.write_text(content, encoding="utf-8")
           def fix_urp_pixelperfect(a, mp):
               content = mp.read_text(encoding="utf-8")
               pkg = "com.unity.2d.pixel-perfect"
               if f'"{pkg}"' in content:
                   content = re.sub(rf'^\s*"{pkg}"\s*:\s*"[^"]+",?\s*$\n?', '', content, flags=re.MULTILINE)
                   mp.write_text(content, encoding="utf-8")
                   print(f"  ✅ Removed {pkg} from manifest (incompatible with Unity 6)")
           REMOVE_IF_UPM=[("com.google.ads.mobile","GoogleMobileAds"),("com.google.external-dependency-manager","ExternalDependencyManager")]
          def remove_conflicting_asset_sdks(a,mp):
              try: deps=json.loads(mp.read_text(encoding="utf-8")).get("dependencies",{})
              except: deps={}
              for pkg,folder in REMOVE_IF_UPM:
                  if pkg in deps and (d:=a/folder).exists(): shutil.rmtree(d); print(f"  ✅ Removed Assets/{folder}")
          EXAMPLE_DIRS=["FacebookSDK/Examples","Facebook/Examples","IronSource/Demo","AppLovin/Demo","MaxSdk/Demos","GoogleMobileAds/Editor"]
          def remove_sdk_examples(a):
              for r in EXAMPLE_DIRS:
                  if (d:=a/r).exists(): shutil.rmtree(d); print(f"  ✅ Removed Assets/{r}")
          def fix_dll_metas(a):
              ANY_META=textwrap.dedent("""\
              fileFormatVersion: 2
              guid: {guid}
              PluginImporter:
                externalObjects: {}
                serializedVersion: 2
                iconMap: {}
                executionOrder: {}
                defineConstraints: []
                isPreloaded: 0
                isOverridable: 0
                isExplicitlyReferenced: 0
                validateReferences: 1
                platformData:
                - first: {'':Any}
                  second: {enabled:1,settings:{Exclude Android:0,Exclude Editor:0,Exclude Linux64:1,Exclude OSXUniversal:1,Exclude Win:1,Exclude Win64:1,Exclude iOS:1}}
                - first: {Any: Editor}
                  second: {enabled:1,settings:{CPU:AnyCPU,DefaultValueInitialized:true,OS:Any}}
                userData:
                assetBundleName:
                assetBundleVariant:
              """)
              fixed=0
              for meta in a.rglob("*.dll.meta"):
                  try: text=meta.read_text(encoding="utf-8",errors="replace")
                  except: continue
                  if "DefaultImporter" not in text: continue
                  g=re.search(r'guid: ([a-f0-9]+)',text); guid=g.group(1) if g else "0"*32
                  meta.write_text(ANY_META.format(guid=guid),encoding="utf-8"); fixed+=1
              if fixed: print(f"  ✅ Fixed {fixed} .dll.meta files")
          def fix_dotween_modules(a):
              removed=0
              for md in a.rglob("DOTween/Modules"):
                  if not md.is_dir(): continue
                  for asmdef in md.rglob("*.asmdef"):
                      asmdef.unlink(); (pathlib.Path(str(asmdef)+".meta")).unlink(missing_ok=True); removed+=1
              if removed: print(f"  ✅ Removed {removed} asmdef in DOTween/Modules")
          def fix_tmp_fonts(a):
              fixed=0
              for af in a.rglob("*.asset"):
                  try: c=af.read_text(encoding="utf-8",errors="replace")
                  except: continue
                  if "m_Script: {fileID: 11500000, guid: 71c1514a6bd24e1e882cebbe1904ce04" not in c: continue
                  if "TextMeshPro/Distance Field" in c or "TextMeshPro/Bitmap" in c:
                      c=re.sub(r'm_Shader: \{fileID: \d+, guid: [a-f0-9]+, type: \d+\}','m_Shader: {fileID: 4800000, guid: 1e3b057af24249748ff873be7fafee47, type: 3}',c)
                      af.write_text(c,encoding="utf-8"); fixed+=1
              if fixed: print(f"  ✅ Fixed {fixed} TMP Font Assets")
          def clear_cached_files(a):
              pr=a.parent; cleared=0
              for cd in [pr/"Library/Artifacts",pr/"Library/ScriptAssemblies",pr/"Library/PackageCache",pr/"Temp"]:
                  if cd.exists(): shutil.rmtree(cd); cleared+=1; print(f"  ✅ Cleared {cd.name}")
              if not cleared: print("  ℹ️  No cache directories found")
          if __name__=="__main__": main()
          EOF
                echo "✅ Created inline fallback script"
              }
            }
          fi
          echo "Running comprehensive SDK integration fixer..."
          python3 "$SCRIPT" "game/Assets" "game/Packages/manifest.json"

