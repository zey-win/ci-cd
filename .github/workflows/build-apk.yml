      - name: Prepare Firebase SDK
        shell: bash
        env:
          FIREBASE_UNITY_VERSION: "13.6.0"
        run: |
          set -euo pipefail
          if ! grep -R --include='*.cs' -E 'using Firebase|Firebase\.' game/Assets >/dev/null 2>&1; then
            echo "No Firebase C# references found; skipping Firebase SDK preparation."
            exit 0
          fi

          if [ -d game/Assets/Firebase ]; then
            echo "Assets/Firebase already exists; keeping game Firebase SDK files."
            exit 0
          fi

          echo "Firebase C# references found; installing Firebase Unity SDK ${FIREBASE_UNITY_VERSION} via .tgz."
          mkdir -p .ci/firebase/packages
          python3 <<'PY'
          import os, pathlib, shutil, subprocess, tarfile
          root = pathlib.Path("game").resolve()
          packages_dir = pathlib.Path(".ci/firebase/packages")
          firebase_version = os.environ["FIREBASE_UNITY_VERSION"]
          package_specs = [
              ("com.google.external-dependency-manager", "1.2.186"),
              ("com.google.firebase.app", firebase_version),
              ("com.google.firebase.analytics", firebase_version),
              ("com.google.firebase.remote-config", firebase_version),
              ("com.google.firebase.messaging", firebase_version),
          ]
          def safe_target(pathname):
              target = (root / pathname).resolve()
              if root not in target.parents and target != root:
                  raise ValueError(f"Refusing to extract outside game repo: {pathname}")
              return target
          def download_tgz(package_name, version):
              package_file = packages_dir / f"{package_name}-{version}.tgz"
              if package_file.is_file(): return package_file
              url = f"https://dl.google.com/games/registry/unity/{package_name}/{package_name}-{version}.tgz"
              subprocess.run(["curl", "-L", "--fail", "--retry", "3", "--retry-delay", "5", "-o", str(package_file), url], check=True)
              return package_file
          def extract_tgz(package_path):
              copied = 0
              with tarfile.open(package_path, "r:gz") as package:
                  for member in package.getmembers():
                      if not member.isfile(): continue
                      name = member.name
                      if not name.startswith("package/"): continue
                      relative = name[len("package/"):]
                      if not relative: continue
                      if not (relative.startswith("Firebase/") or relative.startswith("ExternalDependencyManager/") or
                              relative.startswith("Editor Default Resources/") or relative.startswith("Plugins/")):
                          continue
                      source = package.extractfile(member)
                      if source is None: continue
                      target = safe_target("Assets/" + relative)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open("wb") as out: shutil.copyfileobj(source, out)
                      copied += 1
              return copied
          copied = 0
          for package_name, version in package_specs:
              print(f"Downloading/extracting {package_name} {version}...")
              copied += extract_tgz(download_tgz(package_name, version))
          print(f"Firebase Unity SDK extracted into game Assets ({copied} assets).")
          required = [
              "Assets/ExternalDependencyManager",
              "Assets/Firebase/Editor",
              "Assets/Firebase/Plugins",
          ]
          missing = [p for p in required if not (root / p).is_dir()]
          if missing:
              raise SystemExit("Firebase SDK extraction incomplete: " + ", ".join(missing))
          PY

          if grep -R --include='*.cs' -E 'using Firebase|Firebase\.' game/Assets >/dev/null 2>&1; then
            find game/Assets/Firebase -maxdepth 3 -type f | sed -n '1,80p'
            echo "Firebase SDK prepared successfully."
          else
            echo "No Firebase C# references found; Firebase SDK extraction was not needed."
          fi

