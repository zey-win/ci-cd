      - name: Patch GoogleMobileAdsSettings.asset for UPM compatibility
        shell: bash
        env:
          ADMOB_APP_ID: ${{ inputs.admob_android_app_id || secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "$ADMOB_APP_ID" ]; then
