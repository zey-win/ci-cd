            exit 0
          fi
          python3 <<'PY'
          import json, os, pathlib, re
          game = pathlib.Path("game")
          admob_id = os.environ["ADMOB_APP_ID"]
          for asset in game.rglob("GoogleMobileAdsSettings.asset"):
              text = asset.read_text(encoding="utf-8", errors="replace")
              if "GradleExtensionsImport" in text or re.search(r'ApplicationId:\s*""', text):
                  text = re.sub(r'(ApplicationId:\s*)"[^"]*"', rf'\1"{admob_id}"', text)
                  asset.write_text(text, encoding="utf-8")
                  print(f"✅ Patched AdMob App ID in {asset.relative_to(game)}")
                  break
          else:
              manifest = game / "Packages/manifest.json"
              if manifest.exists():
                  m = json.loads(manifest.read_text(encoding="utf-8"))
                  deps = m.get("dependencies", {})
                  if "com.google.ads.mobile" in deps:
                      print("ℹ️  GMA is UPM-managed; settings will be generated on first Unity import")
                  else:
                      print("⚠️  GoogleMobileAdsSettings.asset not found and GMA not in manifest")
              else:
                  print("⚠️  GoogleMobileAdsSettings.asset not found")
          PY

      - name: Inject AdMob app ID into AndroidManifest.xml
        shell: bash
        env:
          ADMOB_APP_ID: ${{ inputs.admob_android_app_id || secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          ADMOB_APP_ID="${{ inputs.admob_android_app_id || secrets.ADMOB_ANDROID_APP_ID }}"
          python3 <<'PY'
          import os, pathlib, re
          game = pathlib.Path("game")
          admob_id = os.environ.get("ADMOB_APP_ID", "").strip()
          if not admob_id:
              print("No AdMob App ID provided, skipping.")
              exit(0)
          target_manifest = game / "Assets/Plugins/Android/AndroidManifest.xml"
          if not target_manifest.exists():
              target_manifest.parent.mkdir(parents=True, exist_ok=True)
              target_manifest.write_text(f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.unity3d.player"
              xmlns:tools="http://schemas.android.com/tools">
            <application>
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="{admob_id}"/>
            </application>
          </manifest>
          """)
              print(f"✅ Created AndroidManifest.xml with AdMob App ID")
          else:
              text = target_manifest.read_text(encoding="utf-8")
              if "com.google.android.gms.ads.APPLICATION_ID" in text:
                  text = re.sub(
                      r'android:value="[^"]*"',
                      f'android:value="{admob_id}"',
                      text
                  )
                  target_manifest.write_text(text, encoding="utf-8")
                  print(f"✅ Updated AdMob App ID in existing AndroidManifest.xml")
              else:
                  text = text.replace("</application>",
                      f'    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{admob_id}"/>\n  </application>')
                  target_manifest.write_text(text, encoding="utf-8")
                  print(f"✅ Injected AdMob App ID into AndroidManifest.xml")
          PY

      - name: Apply Unity Builder API deprecation fixes
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=".ci-patches/fix-unity-builder-api.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "⚠️  $SCRIPT not found – recovering from git..."
            mkdir -p .ci-patches
            git show HEAD:.ci-patches/fix-unity-builder-api.py > "$SCRIPT" 2>/dev/null || true
          fi
          echo "Applying Unity Builder API deprecation fixes..."
          if [ -f "$SCRIPT" ]; then
            if python3 "$SCRIPT" "game"; then
              echo "✅ Unity Builder API fixes applied successfully"
            else
              echo "⚠️  Unity Builder API patch failed - continuing with unfixed behavior"
              echo "This is expected if the package cache hasn't been populated yet"
              echo "The build may still succeed if there are no deprecated API issues"
            fi
          else
            echo "⚠️  $SCRIPT not available - skipping"
          fi

      - name: Apply BuildResult.Unknown bug fix
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=".ci-patches/apply-buildresult-unknown-fix.py"
          if [ ! -f "$SCRIPT" ]; then
            echo "⚠️  $SCRIPT not found – recovering from git..."
            mkdir -p .ci-patches
            git show HEAD:.ci-patches/apply-buildresult-unknown-fix.py > "$SCRIPT" 2>/dev/null || true
          fi
          echo "Applying BuildResult.Unknown bug fix (exit code 103 → 101)..."
          if [ -f "$SCRIPT" ]; then
            if python3 "$SCRIPT" "game"; then
              echo "✅ BuildResult.Unknown fix applied successfully"
              echo "Fix includes:"
              echo "  - Exit code changed from 103 to 101"
              echo "  - Exception handling with full logging"
              echo "  - BuildReport analysis for error extraction"
              echo "  - Unity version detection and mismatch warning"
            else
              echo "⚠️  BuildResult.Unknown fix not applied - package cache may not be ready yet"
              echo "This is expected if the package hasn't been cached"
              echo "The fix will be applied after Unity resolves packages"
            fi
          else
            echo "⚠️  $SCRIPT not available - skipping"
          fi

      - name: Fix Android build issues
        shell: bash
        run: |
          set -euo pipefail
          echo "Applying Android build fixes for Firebase/Kotlin DEX compatibility..."

          # 1) Remove duplicate Google Mobile Ads plugin (causes plugin collision)
          rm -f game/Assets/Plugins/Android/googlemobileads-unity.aar
          rm -f game/Assets/Plugins/Android/googlemobileads-unity.aar.meta

          # 2) Fix DEX transform error: Firebase/Kotlin 2.x compiled with Java 11+
          #    Unity OpenJDK bundled with Gradle 7.5 needs explicit Java 11 compat
          GRADLE_PROPS="game/Assets/Plugins/Android/gradleTemplate.properties"
          BASE_GRADLE="game/Assets/Plugins/Android/baseProjectTemplate.gradle"

          # Patch gradleTemplate.properties if it exists
          if [ -f "$GRADLE_PROPS" ]; then
            # Force large heap and stack for D8 dexing of heavy coroutine/firebase libraries
            sed -i "/^org.gradle.jvmargs/d" "$GRADLE_PROPS" || true
            echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Xss8m" >> "$GRADLE_PROPS"
          fi

          # Patch baseProjectTemplate.gradle: set Gradle / AGP to support Java 11
          if [ -f "$BASE_GRADLE" ]; then
            # Update Android Gradle Plugin to 7.4.2 which supports Java 11 desugaring
            sed -i "s/com.android.tools.build:gradle:[0-9.]*/com.android.tools.build:gradle:7.4.2/" "$BASE_GRADLE" || true
            # Upgrade Kotlin plugin to 1.9.22 to match stdlib version
            sed -i "s/org.jetbrains.kotlin:kotlin-gradle-plugin:[0-9.]*/org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22/" "$BASE_GRADLE" || true
            # Force upgrade R8/D8 compiler to fix StackOverflowError during dexing of coroutines
            if ! grep -q "com.android.tools:r8" "$BASE_GRADLE"; then
              sed -i '/dependencies {/a \        classpath("com.android.tools:r8:8.3.37")' "$BASE_GRADLE" || true
            fi
          fi

          # --- Fix Double Launcher Icon Bug ---
          python3 -c '
          import os
          manifest = "game/Assets/Plugins/Android/AndroidManifest.xml"
          if os.path.exists(manifest):
              with open(manifest, "r") as f:
                  text = f.read()
              if "com.google.firebase.MessagingUnityPlayerActivity" in text and "android.intent.category.LAUNCHER" in text:
                  if "tools:node=\"remove\"" not in text and "com.unity3d.player.UnityPlayerActivity" not in text:
                      print("Applying Double-Icon Fix: Removing default UnityPlayerActivity")
                      if "xmlns:tools" not in text:
                          text = text.replace("<manifest ", "<manifest xmlns:tools=\"http://schemas.android.com/tools\" ")
                      text = text.replace("</application>", "  <activity android:name=\"com.unity3d.player.UnityPlayerActivity\" tools:node=\"remove\" />\n  </application>")
                      with open(manifest, "w") as f:
                          f.write(text)
          '

          # Patch mainTemplate.gradle: ensure Java 11 source/target compatibility
          MAIN_GRADLE="game/Assets/Plugins/Android/mainTemplate.gradle"
          if [ -f "$MAIN_GRADLE" ]; then
            # Add compileOptions for Java 11 if not present
            if ! grep -q "JavaVersion.VERSION_11" "$MAIN_GRADLE"; then
              sed -i '/compileOptions/,/}/s/sourceCompatibility JavaVersion.VERSION_.*/sourceCompatibility JavaVersion.VERSION_11/' "$MAIN_GRADLE" || true
              sed -i '/compileOptions/,/}/s/targetCompatibility JavaVersion.VERSION_.*/targetCompatibility JavaVersion.VERSION_11/' "$MAIN_GRADLE" || true
            fi
            # Downgrade kotlinx-coroutines to 1.8.1 to avoid StackOverflowError in D8 from AGP 7.x
            if ! grep -q "kotlinx-coroutines-core:1.8.1" "$MAIN_GRADLE"; then
              echo 'configurations.all { resolutionStrategy.force "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1", "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1", "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1" }' >> "$MAIN_GRADLE"
            fi
          fi

          echo "Android build fixes applied!"

      - name: Disable Spine post-processor (NullReferenceException workaround)
        shell: bash
        run: |
          set -euo pipefail
          spine_file="game/Assets/Spine/Editor/spine-unity/Editor/Utility/SpineEditorUtilities.cs"
          if [ -f "$spine_file" ]; then
            sed -i 's/void OnPostprocessAllAssets/void __OnPostprocessAllAssets/g' "$spine_file"
            echo "✅ Disabled Spine OnPostprocessAllAssets to prevent NullReferenceException"
          else
            echo "SpineEditorUtilities.cs not found, no fix needed"
          fi

      - name: Clear PackageCache after fixes
        shell: bash
        run: |
          set -euo pipefail
          echo "Clearing Unity PackageCache to force fresh package resolution..."
          rm -rf game/Library/PackageCache
          echo "PackageCache cleared"

      - name: Build custom parameters
        id: build_custom_params
        shell: bash
        env:
          ZEYWIN_API_KEY: ${{ inputs.zeywin_api_key || secrets.ZEYWIN_API_KEY }}
          ADMOB_ANDROID_APP_ID: ${{ inputs.admob_android_app_id || secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_ANDROID_BANNER_ID: ${{ inputs.admob_android_banner_id || secrets.ADMOB_ANDROID_BANNER_ID }}
          ADMOB_ANDROID_INTERSTITIAL_ID: ${{ inputs.admob_android_interstitial_id || secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
          ADMOB_ANDROID_REWARDED_ID: ${{ inputs.admob_android_rewarded_id || secrets.ADMOB_ANDROID_REWARDED_ID }}
          ADMOB_ANDROID_REWARDED_INTERSTITIAL_ID: ${{ inputs.admob_android_rewarded_interstitial_id || secrets.ADMOB_ANDROID_REWARDED_INTERSTITIAL_ID }}
          ADMOB_ANDROID_NATIVE_ID: ${{ inputs.admob_android_native_id || secrets.ADMOB_ANDROID_NATIVE_ID }}
          ADMOB_ANDROID_APP_OPEN_ID: ${{ inputs.admob_android_app_open_id || secrets.ADMOB_ANDROID_APP_OPEN_ID }}
          APK_OUTPUT_PATH: ${{ steps.resolve_version.outputs.apk_output_path }}
          AAB_OUTPUT_PATH: ${{ steps.resolve_version.outputs.aab_output_path }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          APP_NAME: ${{ inputs.app_name }}
          VERSION_NAME: ${{ steps.resolve_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.resolve_version.outputs.version_code }}
        run: |
          set -euo pipefail
          
          params="-logFile - -apkOutputPath \"$APK_OUTPUT_PATH\" -aabOutputPath \"$AAB_OUTPUT_PATH\""
          params="$params -androidPackageName \"$PACKAGE_NAME\" -androidVersionName \"$VERSION_NAME\" -androidVersionCode \"$VERSION_CODE\""
          params="$params -zeywinApiKey \"$ZEYWIN_API_KEY\""
          
          # Only add AdMob params if they have values
          [ -n "$ADMOB_ANDROID_APP_ID" ] && params="$params -admobAndroidAppId \"$ADMOB_ANDROID_APP_ID\""
          [ -n "$ADMOB_ANDROID_BANNER_ID" ] && params="$params -admobAndroidBannerId \"$ADMOB_ANDROID_BANNER_ID\""
          [ -n "$ADMOB_ANDROID_INTERSTITIAL_ID" ] && params="$params -admobAndroidInterstitialId \"$ADMOB_ANDROID_INTERSTITIAL_ID\""
          [ -n "$ADMOB_ANDROID_REWARDED_ID" ] && params="$params -admobAndroidRewardedId \"$ADMOB_ANDROID_REWARDED_ID\""
          [ -n "$ADMOB_ANDROID_REWARDED_INTERSTITIAL_ID" ] && params="$params -admobAndroidRewardedInterstitialId \"$ADMOB_ANDROID_REWARDED_INTERSTITIAL_ID\""
          [ -n "$ADMOB_ANDROID_NATIVE_ID" ] && params="$params -admobAndroidNativeId \"$ADMOB_ANDROID_NATIVE_ID\""
          [ -n "$ADMOB_ANDROID_APP_OPEN_ID" ] && params="$params -admobAndroidAppOpenId \"$ADMOB_ANDROID_APP_OPEN_ID\""
          
          echo "custom_params=$params" >> "$GITHUB_OUTPUT"

      - name: Build APK
        uses: game-ci/unity-builder@v4
        timeout-minutes: 105
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GIT_PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ANDROID_KEYSTORE_PATH: /github/workspace/.ci/keystore/user.keystore
          ANDROID_PACKAGE_NAME: ${{ inputs.package_name }}
          ANDROID_PRODUCT_NAME: ${{ inputs.app_name }}
          ANDROID_VERSION_NAME: ${{ steps.resolve_version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.resolve_version.outputs.version_code }}
          ZEYWIN_API_KEY: ${{ inputs.zeywin_api_key || secrets.ZEYWIN_API_KEY }}
          ADMOB_ANDROID_APP_ID: ${{ inputs.admob_android_app_id || secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_ANDROID_BANNER_ID: ${{ inputs.admob_android_banner_id || secrets.ADMOB_ANDROID_BANNER_ID }}
          ADMOB_ANDROID_INTERSTITIAL_ID: ${{ inputs.admob_android_interstitial_id || secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
          ADMOB_ANDROID_REWARDED_ID: ${{ inputs.admob_android_rewarded_id || secrets.ADMOB_ANDROID_REWARDED_ID }}
          ADMOB_ANDROID_REWARDED_INTERSTITIAL_ID: ${{ inputs.admob_android_rewarded_interstitial_id || secrets.ADMOB_ANDROID_REWARDED_INTERSTITIAL_ID }}
          ADMOB_ANDROID_NATIVE_ID: ${{ inputs.admob_android_native_id || secrets.ADMOB_ANDROID_NATIVE_ID }}
          ADMOB_ANDROID_APP_OPEN_ID: ${{ inputs.admob_android_app_open_id || secrets.ADMOB_ANDROID_APP_OPEN_ID }}
          APK_OUTPUT_PATH: ${{ steps.resolve_version.outputs.apk_output_path }}
          AAB_OUTPUT_PATH: ${{ steps.resolve_version.outputs.aab_output_path }}
        with:
          unityVersion: 6000.0.71f1
          targetPlatform: Android
          projectPath: game
          versioning: None
          buildMethod: ${{ inputs.build_format == 'aab' && 'BuildGithubActionsApk.BuildAndroidAppBundle' || 'BuildGithubActionsApk.BuildAndroid' }}
          customParameters: ${{ steps.build_custom_params.outputs.custom_params }}

      - name: Build AAB for APK+AAB
        if: ${{ inputs.build_format == 'apk_aab' }}
        uses: game-ci/unity-builder@v4
        timeout-minutes: 105
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GIT_PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ANDROID_KEYSTORE_PATH: /github/workspace/.ci/keystore/user.keystore
          ANDROID_PACKAGE_NAME: ${{ inputs.package_name }}
          ANDROID_PRODUCT_NAME: ${{ inputs.app_name }}
          ANDROID_VERSION_NAME: ${{ steps.resolve_version.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.resolve_version.outputs.version_code }}
          ZEYWIN_API_KEY: ${{ inputs.zeywin_api_key || secrets.ZEYWIN_API_KEY }}
          ADMOB_ANDROID_APP_ID: ${{ inputs.admob_android_app_id || secrets.ADMOB_ANDROID_APP_ID }}
          ADMOB_ANDROID_BANNER_ID: ${{ inputs.admob_android_banner_id || secrets.ADMOB_ANDROID_BANNER_ID }}
          ADMOB_ANDROID_INTERSTITIAL_ID: ${{ inputs.admob_android_interstitial_id || secrets.ADMOB_ANDROID_INTERSTITIAL_ID }}
          ADMOB_ANDROID_REWARDED_ID: ${{ inputs.admob_android_rewarded_id || secrets.ADMOB_ANDROID_REWARDED_ID }}
          ADMOB_ANDROID_REWARDED_INTERSTITIAL_ID: ${{ inputs.admob_android_rewarded_interstitial_id || secrets.ADMOB_ANDROID_REWARDED_INTERSTITIAL_ID }}
          ADMOB_ANDROID_NATIVE_ID: ${{ inputs.admob_android_native_id || secrets.ADMOB_ANDROID_NATIVE_ID }}
          ADMOB_ANDROID_APP_OPEN_ID: ${{ inputs.admob_android_app_open_id || secrets.ADMOB_ANDROID_APP_OPEN_ID }}
          APK_OUTPUT_PATH: ${{ steps.resolve_version.outputs.apk_output_path }}
          AAB_OUTPUT_PATH: ${{ steps.resolve_version.outputs.aab_output_path }}
        with:
          unityVersion: 6000.0.71f1
          targetPlatform: Android
          projectPath: game
          versioning: None
          buildMethod: BuildGithubActionsApk.BuildAndroidAppBundle
          customParameters: ${{ steps.build_custom_params.outputs.custom_params }}

      - name: Upload Unity build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-log
          path: |
            build/unity-build.log
            game/build/unity-build.log
          if-no-files-found: ignore

      - name: Verify Android build output
        shell: bash
        env:
          BUILD_FORMAT: ${{ inputs.build_format }}
          APK_OUTPUT_PATH: ${{ steps.resolve_version.outputs.apk_output_path }}
          AAB_OUTPUT_PATH: ${{ steps.resolve_version.outputs.aab_output_path }}
        run: |
          set -euo pipefail
          sudo chown -R "$USER:$USER" build Builds game/build game/Builds game/Library/Bee/Android 2>/dev/null || true
          mkdir -p "$(dirname "$APK_OUTPUT_PATH")" "$(dirname "$AAB_OUTPUT_PATH")"

          verify_one() {
            local output_path="$1"
            local ext="$2"

            if [ ! -f "$output_path" ]; then
              echo "Android $ext was not created at expected path: $output_path"
              echo "Searching for .$ext files in Unity output folders..."
              found_output="$(find build/android Builds game/build game/Builds game/Library/Bee/Android -type f -name "*.$ext" -print 2>/dev/null | head -n 1 || true)"
              if [ -n "$found_output" ]; then
                echo "Found .$ext at $found_output"
                cp "$found_output" "$output_path"
              fi
            fi

            if [ ! -f "$output_path" ]; then
              echo "Android $ext was not created and no fallback .$ext was found."
              echo "----- android package files -----"
              find . -type f \( -name '*.apk' -o -name '*.aab' \) -print || true
              echo "----- build files -----"
              find build Builds game/build game/Builds game/Library/Bee/Android -maxdepth 8 -type f -print 2>/dev/null || true
              echo "----- important Unity log lines from console log -----"
              if [ -f build/unity-build.log ]; then
                grep -E "ZeyWinActions|Build result|error CS|Script Compilation Error|Exception|Android build failed" build/unity-build.log || true
              elif [ -f game/build/unity-build.log ]; then
                grep -E "ZeyWinActions|Build result|error CS|Script Compilation Error|Exception|Android build failed" game/build/unity-build.log || true
              else
                echo "Unity log file was not written because Unity logs are streamed to the GitHub Actions console."
              fi
              exit 1
            fi

            ls -lh "$output_path"
          }

          if [ "$BUILD_FORMAT" = "aab" ]; then
            verify_one "$AAB_OUTPUT_PATH" "aab"
          elif [ "$BUILD_FORMAT" = "apk_aab" ]; then
            verify_one "$APK_OUTPUT_PATH" "apk"
            verify_one "$AAB_OUTPUT_PATH" "aab"
          else
            verify_one "$APK_OUTPUT_PATH" "apk"
          fi

      - name: Sign Android App Bundle
        if: ${{ inputs.build_format == 'aab' || inputs.build_format == 'apk_aab' }}
        shell: bash
        env:
          AAB_OUTPUT_PATH: ${{ steps.resolve_version.outputs.aab_output_path }}
        run: |
          set -euo pipefail
          test -f "$AAB_OUTPUT_PATH" || { echo "AAB not found before signing: $AAB_OUTPUT_PATH"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASS" || { echo "ANDROID_KEYSTORE_PASS secret is empty."; exit 1; }

          alias_name="${ANDROID_KEYALIAS_NAME:-social casino}"
          alias_pass="${ANDROID_KEYALIAS_PASS:-$ANDROID_KEYSTORE_PASS}"
          unsigned_path="/tmp/$(basename "${AAB_OUTPUT_PATH%.aab}")-unsigned.aab"
          cp "$AAB_OUTPUT_PATH" "$unsigned_path"

          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$GITHUB_WORKSPACE/.ci/keystore/user.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASS" \
            -keypass "$alias_pass" \
            "$AAB_OUTPUT_PATH" \
            "$alias_name"

          jarsigner -verify -verbose -certs "$AAB_OUTPUT_PATH" | tee /tmp/aab-signature-verify.txt
          if grep -q "jar is unsigned" /tmp/aab-signature-verify.txt; then
            echo "AAB is still unsigned after jarsigner."
            exit 1
          fi

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_format == 'apk_aab' && 'APK_AAB' || (inputs.build_format == 'aab' && 'AAB' || 'APK') }}_${{ inputs.package_name }}_v${{ steps.resolve_version.outputs.version_code }}
          path: |
            build/android/*.apk
            build/android/*.aab
          if-no-files-found: error

      - name: Publish Android package release and metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_FORMAT: ${{ inputs.build_format }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION_NAME: ${{ steps.resolve_version.outputs.version_name }}
          VERSION_CODE: ${{ steps.resolve_version.outputs.version_code }}
          APK_OUTPUT_PATH: ${{ steps.resolve_version.outputs.apk_output_path }}
          AAB_OUTPUT_PATH: ${{ steps.resolve_version.outputs.aab_output_path }}

        run: |
          set -euo pipefail
          package_paths=()
          if [ "$BUILD_FORMAT" = "aab" ]; then
            package_paths+=("$AAB_OUTPUT_PATH")
          elif [ "$BUILD_FORMAT" = "apk_aab" ]; then
            package_paths+=("$APK_OUTPUT_PATH" "$AAB_OUTPUT_PATH")
          else
            package_paths+=("$APK_OUTPUT_PATH")
          fi

          for package_path in "${package_paths[@]}"; do
            if [ ! -f "$package_path" ]; then
              echo "Expected Android package is missing before release publish: $package_path"
              exit 1
            fi
          done

          version_dir="builds/$PACKAGE_NAME/v$VERSION_CODE"
          latest_dir="builds/$PACKAGE_NAME"
          mkdir -p "$version_dir" "$latest_dir"
          release_tag="android-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$release_tag"
          release_assets=()
          for package_path in "${package_paths[@]}"; do
            package_name="$(basename "$package_path")"
            release_assets+=("$package_path#$package_name")
          done

          gh release create "$release_tag" "${release_assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${BUILD_FORMAT^^} $PACKAGE_NAME v$VERSION_CODE" \
            --notes "${BUILD_FORMAT^^} built by GitHub Actions run $GITHUB_RUN_NUMBER attempt $GITHUB_RUN_ATTEMPT."

          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          mkdir -p "$version_dir" "$latest_dir"
          package_repo_paths=()
          apk_asset=""
          apk_path=""
          aab_asset=""
          aab_path=""

          for package_path in "${package_paths[@]}"; do
            package_name="$(basename "$package_path")"
            package_ext="${package_name##*.}"
            package_size="$(wc -c < "$package_path")"
            if [ "$package_size" -lt 90000000 ]; then
              cp "$package_path" "$version_dir/$package_name"
              package_repo_path="$version_dir/$package_name"
            else
              package_repo_path="$version_dir/$package_name.url"
              printf '%s\n' "$release_url" > "$package_repo_path"
            fi
            shasum -a 256 "$package_path" | sed "s#  .*#  $package_name#" > "$version_dir/$package_name.sha256"
            package_repo_paths+=("$package_repo_path" "$version_dir/$package_name.sha256")

            if [ "$package_ext" = "apk" ]; then
              apk_asset="$package_name"
              apk_path="$package_repo_path"
            elif [ "$package_ext" = "aab" ]; then
              aab_asset="$package_name"
              aab_path="$package_repo_path"
            fi
          done

          package_repo_path="${apk_path:-$aab_path}"

          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "commit_sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "package_name=$PACKAGE_NAME"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "build_format=$BUILD_FORMAT"
            echo "apk_artifact=${BUILD_FORMAT^^}_${PACKAGE_NAME}_v${VERSION_CODE}"
            echo "apk_release=$release_url"
            if [ -n "$apk_asset" ]; then
              echo "apk_asset=$apk_asset"
              echo "apk_path=$apk_path"
            fi
            if [ -n "$aab_asset" ]; then
              echo "aab_asset=$aab_asset"
              echo "aab_path=$aab_path"
            fi
            echo "package_repo_path=$package_repo_path"
            echo "built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "run_url=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$version_dir/build.txt"

          current_latest_code="$(sed -n 's/^version_code=//p' "$latest_dir/latest-build.txt" 2>/dev/null | tail -n 1 || true)"
          if ! [[ "$current_latest_code" =~ ^[0-9]+$ ]]; then
            current_latest_code=0
          fi

          latest_files=("$version_dir/build.txt")
          if [ -f "$version_dir/google-play-ui-upload.md" ]; then
            latest_files+=("$version_dir/google-play-ui-upload.md")
          fi
          if [ "$VERSION_CODE" -ge "$current_latest_code" ]; then
            cp "$version_dir/build.txt" "$latest_dir/latest-build.txt"
            latest_files+=("$latest_dir/latest-build.txt")
          else
            echo "Built old version code $VERSION_CODE. Keeping latest-build.txt at version code $current_latest_code."
          fi

          {
            echo "# Latest APK Builds"
            echo
            echo "Use this table before workflow runs. For a new release, use the next manual values. For an old-version rebuild, enter the old version manually."
            echo
            echo "| Package | Latest version name | Latest version code | Next manual version name | Next manual version code | APK |"
            echo "| --- | --- | ---: | --- | ---: | --- |"
            while IFS= read -r latest_file; do
              pkg="$(sed -n 's/^package_name=//p' "$latest_file" | tail -n 1)"
              name="$(sed -n 's/^version_name=//p' "$latest_file" | tail -n 1)"
              code="$(sed -n 's/^version_code=//p' "$latest_file" | tail -n 1)"
              path="$(sed -n 's/^package_repo_path=//p' "$latest_file" | tail -n 1)"
              if [ -z "$path" ]; then
                path="$(sed -n 's/^apk_path=//p' "$latest_file" | tail -n 1)"
              fi
              if [[ "$code" =~ ^[0-9]+$ ]]; then
                next_code=$((code + 1))
              else
                next_code=1
              fi
              echo "| \`$pkg\` | \`$name\` | \`$code\` | \`1.0.$next_code\` | \`$next_code\` | [$path]($path) |"
            done < <(find builds -mindepth 2 -maxdepth 2 -name latest-build.txt -type f | sort)
          } > builds/index.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "${package_repo_paths[@]}" "${latest_files[@]}" builds/index.md

          if git diff --cached --quiet; then
            echo "APK metadata in repository is already up to date: builds/latest-build.txt"
            exit 0
          fi

          git commit -m "Record Android package from GitHub Actions run $GITHUB_RUN_NUMBER"
          if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
            echo "Metadata rebase failed after APK release upload. APK is already available in the release: $release_url"
            exit 0
          fi

          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "Metadata push failed after APK release upload. APK is already available in the release: $release_url"
            exit 0
          fi


